server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: interview-coach-ai
  profiles:
    active: dev
  # 数据源（dev profile 覆盖具体配置）
  datasource:
    url: jdbc:mysql://localhost:3306/interview_coach?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123}

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    root: INFO
    com.interviewcoach: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"


app:
  # ==== 认证 ====
  auth:
    # JWT 签名秘钥（生产环境通过环境变量注入）
    jwt-secret: ${JWT_SECRET:interview-coach-jwt-secret-key-32bytes!}
    # GitHub OAuth2
    github:
      client-id: ${GITHUB_CLIENT_ID:Ov23lia0zkgygySP2hjh}
      client-secret: ${GITHUB_CLIENT_SECRET:d874d80bfd40d3640e8d2ab2559e973abff0da5d}

  # ---- LLM 大语言模型 ----
  llm:
    provider: ${AI_PROVIDER:mock}
    # 每个 Provider 独立配置
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com
      model: gpt-4o-mini
    azure:
      api-key: ${AZURE_OPENAI_API_KEY:}
      base-url: ${AZURE_OPENAI_ENDPOINT:}
      region: ${AZURE_OPENAI_REGION:}
      model: gpt-4o-mini
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      model: deepseek-chat
    qwen:
      api-key: ${QWEN_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: qwen-plus
    glm:
      api-key: ${GLM_API_KEY:}
      base-url: https://open.bigmodel.cn/api/paas/v4
      model: glm-4-flash
    kimi:
      api-key: ${KIMI_API_KEY:}
      base-url: https://api.moonshot.cn/v1
      model: moonshot-v1-8k
    temperature: 0.7

  # ---- ASR 语音识别 ----
  asr:
    provider: ${ASR_PROVIDER:mock}
    openai:
      api-key: ${ASR_OPENAI_API_KEY:${OPENAI_API_KEY:}}
      base-url: https://api.openai.com
      model: whisper-1

  # ---- TTS 语音合成 ----
  tts:
    provider: ${TTS_PROVIDER:mock}
    openai:
      api-key: ${TTS_OPENAI_API_KEY:${OPENAI_API_KEY:}}
      base-url: https://api.openai.com
      model: tts-1
      voice: alloy

  # ---- 讯飞星火 WebAPI ----
  iflytek:
    app-id: ${IFLYTEK_APP_ID:6497f9b2}
    api-key: ${IFLYTEK_API_KEY:}
    tts-voice: ${IFLYTEK_TTS_VOICE:xiaoyan}

  websocket:
    endpoint: /ws/interview
    heartbeat-seconds: 30
    allowed-origins: ${CORS_ORIGINS:*}

  prompt:
    # 相对于 classpath 的 prompt 目录
    location: prompts

  interview:
    # 默认场景类型：hr / technical / pressure
    default-type: ${INTERVIEW_TYPE:hr}
